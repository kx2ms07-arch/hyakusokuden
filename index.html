<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>百足伝学習アプリ</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="百足伝">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef0ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12161b" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/svg+xml" href="icons/icon-b.svg">
<style>
/* 伝書の頁のように、中央の一段組。歌は縦書きで主役、操作は親指の届く下側に集める */
:root{
  --paper:#eef0ec; --surface:#fafbf8; --ink:#1b1e22; --ink-2:#5a6068; --line:#d5d9d2;
  --ai:#27466d; --ai-ink:#ffffff; --ai-soft:#dde5ee; --shu:#b2402c; --shu-soft:#f6e1dc;
  --kin:#8c6d2c; --good:#2d6a4c; --good-soft:#dcebe2;
  --lv0:#e3e6e0; --lv1:#cfdbe8; --lv2:#a9c0da; --lv3:#7d9dc4; --lv4:#4d76a8; --lv5:#27466d;
  --mincho:"Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
  --gothic:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12161b; --surface:#1a2027; --ink:#e8e5dd; --ink-2:#a2a7ae; --line:#2c343e;
  --ai:#8fb1d9; --ai-ink:#0f1620; --ai-soft:#223246; --shu:#e3806a; --shu-soft:#3a2420;
  --kin:#d3b36e; --good:#7fc6a0; --good-soft:#1d3329;
  --lv0:#232a33; --lv1:#26384d; --lv2:#2f4b6b; --lv3:#3f6590; --lv4:#5f87b8; --lv5:#8fb1d9; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12161b; --surface:#1a2027; --ink:#e8e5dd; --ink-2:#a2a7ae; --line:#2c343e;
  --ai:#8fb1d9; --ai-ink:#0f1620; --ai-soft:#223246; --shu:#e3806a; --shu-soft:#3a2420;
  --kin:#d3b36e; --good:#7fc6a0; --good-soft:#1d3329;
  --lv0:#232a33; --lv1:#26384d; --lv2:#2f4b6b; --lv3:#3f6590; --lv4:#5f87b8; --lv5:#8fb1d9; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{padding-top:env(safe-area-inset-top,0px);margin:0;background:var(--paper);color:var(--ink);font-family:var(--gothic);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 96px}
.wrap.play{padding-bottom:24px}
h1,h2,h3{font-family:var(--mincho);font-weight:700;text-wrap:balance;margin:0}
h1{font-size:1.5rem;letter-spacing:.06em}
h2{font-size:1.2rem;letter-spacing:.04em}
.muted{color:var(--ink-2)}
.small{font-size:.82rem}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.btn.primary{background:var(--ai);border-color:var(--ai);color:var(--ai-ink)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.btn.ghost{background:transparent}
.eyebrow{font-size:.75rem;letter-spacing:.12em;color:var(--ink-2)}
.title-chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mincho);color:var(--kin);border:1px solid var(--kin);border-radius:999px;padding:2px 12px;font-size:.9rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{text-align:center;padding:10px 4px}
.stat b{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums;font-family:var(--mincho)}
.stat span{font-size:.75rem;color:var(--ink-2)}
.levelbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--lv0)}
.levelbar i{display:block;height:100%}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.75rem;color:var(--ink-2)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;background:var(--c)}
.sec{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-align:left;width:100%;cursor:pointer}
.sec .nm{font-family:var(--mincho);font-size:1.1rem;font-weight:700}
.sec .pips{grid-column:1 / -1;display:flex;gap:3px}
.sec .pips i{flex:1;height:6px;border-radius:2px;background:var(--lv0)}
.sec.locked{opacity:.55;cursor:default}
.stagebadges{display:flex;gap:4px}
.stagebadges b{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);font-size:.7rem;display:grid;place-items:center;font-weight:600;color:var(--ink-2)}
.stagebadges b.on{background:var(--ai);border-color:var(--ai);color:var(--ai-ink)}
.mode{display:grid;grid-template-columns:40px 1fr auto;gap:4px 12px;align-items:center;text-align:left;width:100%;cursor:pointer}
.mode .num{grid-row:span 2;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--mincho);font-weight:700;border:1px solid var(--line)}
.mode.passed .num{background:var(--ai);color:var(--ai-ink);border-color:var(--ai)}
.mode .nm{font-weight:700}
.mode .best{grid-row:span 2;font-size:.8rem;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav.tabs .in{display:flex;width:100%;max-width:560px}
nav.tabs button{flex:1;border:0;background:none;padding:10px 0 12px;font-size:.78rem;color:var(--ink-2);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button b{font-family:var(--mincho);font-size:1.15rem;line-height:1.1}
nav.tabs button.on{color:var(--ai)}
/* 歌 */
.poem{font-family:var(--mincho);font-weight:500;color:var(--ink)}
.poem rt{font-family:var(--gothic);font-size:.42em;color:var(--ink-2);font-weight:400}
.poem.v{writing-mode:vertical-rl;height:20.5em;font-size:clamp(1.15rem,5vw,1.5rem);line-height:2.2;letter-spacing:.1em;margin:0 auto;display:block}
.poem.v .ku{margin:0}
.poem.v .shimo{padding-top:2.4em}
.poem.h{font-size:1.2rem;line-height:2}
.poem.h .ku{margin:0}
.poem.h .shimo{padding-left:2em}
.poem-wrap{display:flex;justify-content:center;padding:18px 0;overflow-x:auto}
.label{font-family:var(--mincho);font-weight:700;letter-spacing:.1em}
.notes{font-size:.82rem;color:var(--ink-2);text-align:center}
.hidden-shimo{color:transparent;text-shadow:none;background:repeating-linear-gradient(0deg,var(--line) 0 1px,transparent 1px 8px);border-radius:4px}
/* プレイ */
.playbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.playbar .x{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.1rem}
.playbar .meta{flex:1;min-width:0}
.playbar .meta div{font-size:.78rem;color:var(--ink-2)}
.score{text-align:right;font-variant-numeric:tabular-nums}
.score b{font-family:var(--mincho);font-size:1.25rem}
.combo{font-size:.75rem;color:var(--kin);font-weight:700;min-height:1.2em}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:14px}
.progress i{display:block;height:100%;background:var(--ai)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;font-family:var(--mincho);font-size:1.08rem;line-height:1.9;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.opt rt{font-size:.5em;color:var(--ink-2);font-family:var(--gothic)}
.opt.good{border-color:var(--good);background:var(--good-soft)}
.opt.bad{border-color:var(--shu);background:var(--shu-soft)}
.built{min-height:6.2em;font-family:var(--mincho);font-size:1.15rem;line-height:2;padding:12px 14px;border:1px dashed var(--line);border-radius:10px;background:var(--surface)}
.built .br{display:block;height:0}
.built .done{color:var(--ink)}
.built .slot{color:var(--ink-2)}
.built .blank{display:inline-block;min-width:3.2em;text-align:center;border-bottom:2px solid var(--line);margin:0 2px;color:var(--ink-2)}
.built .blank.cur{border-bottom-color:var(--ai);color:var(--ai);font-weight:700}
.built .fixed{color:var(--shu)}
.opts.grid2{display:grid;grid-template-columns:1fr 1fr}
.opts.grid2 .opt{text-align:center}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.tile{font-family:var(--mincho);font-size:1.08rem;padding:8px 12px;min-height:48px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;line-height:1.6}
.tile rt{font-size:.5em;color:var(--ink-2);font-family:var(--gothic)}
.tile.used{visibility:hidden}
.tile.bad{animation:shake .3s;border-color:var(--shu);background:var(--shu-soft)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.lives{color:var(--shu);letter-spacing:.2em}
.timer{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0 4px}
.timer i{display:block;height:100%;background:var(--kin);width:100%;transform-origin:left}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grade .btn{flex-direction:column;gap:0;font-size:.9rem;padding:8px 4px}
.grade .ok{border-color:var(--good);color:var(--good)}
.grade .mid{border-color:var(--kin);color:var(--kin)}
.grade .ng{border-color:var(--shu);color:var(--shu)}
.bottom-actions{position:sticky;bottom:0;padding-top:12px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--paper) 30%)}
/* 一覧 */
.grid10{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cell{aspect-ratio:1/1.15;max-width:100%;border-radius:8px;border:1px solid var(--line);background:var(--lv0);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:2px}
.cell b{font-family:var(--mincho);font-size:.95rem}
.cell span{font-size:.62rem;line-height:1.2;text-align:center;font-family:var(--mincho)}
.cell.l4,.cell.l5{color:#fff}
:root[data-theme="dark"] .cell.l4,:root[data-theme="dark"] .cell.l5{color:#0f1620}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cell.l4,:root:not([data-theme="light"]) .cell.l5{color:#0f1620}}
table.t{width:100%;border-collapse:collapse;font-size:.85rem}
table.t th,table.t td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
table.t td.n{text-align:right;font-variant-numeric:tabular-nums}
.ttl{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line)}
.ttl b{font-family:var(--mincho);min-width:7em}
.ttl.off b{color:var(--ink-2)}
.ttl.on b{color:var(--kin)}
.ttl span{font-size:.8rem;color:var(--ink-2)}
/* 設定 */
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.set label{flex:1}
.switch{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);transition:left .15s}
.switch:checked{background:var(--ai)}
.switch:checked::after{left:23px}
select{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
textarea{width:100%;min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:.72rem;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:.85rem;z-index:20;max-width:calc(100% - 32px)}
.result-big{text-align:center;padding:10px 0}
.result-big b{font-family:var(--mincho);font-size:2.4rem;font-variant-numeric:tabular-nums}
.stamp{display:inline-block;font-family:var(--mincho);font-weight:700;color:var(--shu);border:2px solid var(--shu);padding:2px 12px;border-radius:4px;transform:rotate(-4deg);letter-spacing:.1em}
.newtitle{color:var(--kin);font-family:var(--mincho);font-weight:700}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="app"></div>
<nav class="tabs" id="tabs"><div class="in">
  <button data-tab="home"><b>家</b>ホーム</button>
  <button data-tab="study"><b>習</b>学習</button>
  <button data-tab="list"><b>覧</b>一覧</button>
  <button data-tab="records"><b>録</b>記録</button>
  <button data-tab="settings"><b>設</b>設定</button>
</div></nav>
<div class="toast" id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
